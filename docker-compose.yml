version: '3.9'

services:
  onboarding-engine:
    build: .
    container_name: insta-onboarding
    environment:
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-10}
      - TOTAL_SIMULATION_JOBS=${TOTAL_SIMULATION_JOBS:-50}
      - USE_PROXY=${USE_PROXY:-true}
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-sandbox}
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HEADLESS=${HEADLESS:-true}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
    volumes:
      - ./proxies.txt:/app/proxies.txt
      - ./logs:/app/logs
      - ./onboarding_results.db:/app/onboarding_results.db
      - ./.encryption_key:/app/.encryption_key
    restart: on-failure:3
    networks:
      - onboarding-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  onboarding-net:
    driver: bridge
